volumes:
  db-data:
  opensearch-data:
  composer-cache:

services:
  db:
    image: mariadb:${MARIADB_VERSION}
    command:
      - --max_allowed_packet=128M
      - --optimizer_switch=rowid_filter=off
      - --optimizer_use_condition_selectivity=1
      - --log_bin_trust_function_creators=1
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
    working_dir: /var/www/html
    environment:
      COMPOSER_HOME: /composer
      COMPOSER_MEMORY_LIMIT: -1
      # Consumed by bin/magento setup:install and by the integration bootstrap.
      MAGE_DB_HOST: db
      MAGE_DB_NAME: ${DB_NAME}
      MAGE_DB_USER: ${DB_USER}
      MAGE_DB_PASSWORD: ${DB_PASSWORD}
      MAGE_DB_TEST_NAME: ${DB_TEST_NAME}
    volumes:
      - ./magento:/var/www/html
      # Mounted at the same path inside and out. Individual modules are ALSO
      # bind-mounted into app/code by bin/link-module (see
      # docker-compose.override.yml) — that is what Magento actually loads.
      - ${MODULES_PATH}:${MODULES_PATH}
      - composer-cache:/composer
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  web:
    image: nginx:${NGINX_VERSION}-alpine
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./magento:/var/www/html
      - ${MODULES_PATH}:${MODULES_PATH}
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
