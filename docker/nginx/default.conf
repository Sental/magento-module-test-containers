upstream fastcgi_backend {
    server php:9000;
}

server {
    listen 80;
    server_name localhost;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;

    client_max_body_size 64m;

    # Magento ships its own battle-tested routing rules; use them rather than
    # hand-rolling static/media/setup handling. This file only exists once the
    # project has been created, so `web` is started after the install.
    include /var/www/html/nginx.conf.sample;
}
