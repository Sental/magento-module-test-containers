; Magento/Mage-OS baseline for a local test rig — generous limits, developer-friendly.
memory_limit = 4G
max_execution_time = 1800
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = UTC

realpath_cache_size = 10M
realpath_cache_ttl = 7200

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.max_accelerated_files = 60000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Symlinked modules change identity when re-linked; without this, opcache can
; serve stale bytecode from the previous link target.
opcache.file_cache_only = 0
opcache.save_comments = 1

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
