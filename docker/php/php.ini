; Magento/Mage-OS baseline for a local test rig — generous limits, developer-friendly.
memory_limit = 4G
max_execution_time = 1800
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = UTC

; A 2-hour realpath TTL is a production setting. On a rig where modules are
; mounted, unmounted and edited constantly it caches stale path resolution and
; produces "file exists but Magento can't see it" confusion. Keep it short.
realpath_cache_size = 4M
realpath_cache_ttl = 10

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.max_accelerated_files = 60000
; Always stat files and act on the result immediately. Without both of these,
; opcache serves bytecode cached against a path whose target has since changed
; — the classic "I edited the file and nothing happened" failure when a module
; is remounted or its contents swapped underneath a running container.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.file_cache_only = 0
opcache.save_comments = 1

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
